## 1. Project Overview

### 1.1 Problem Statement

Indian farmers lose **₹50,000–₹1,00,000 per acre annually** due to weed infestation. Current solutions — manual labor or blanket herbicide spraying — are either labor-intensive or environmentally destructive. Blanket spraying wastes **70–80%** of herbicide on bare soil and damages crops through chemical drift, contaminating groundwater and degrading soil health over successive seasons.

### 1.2 Proposed Solution

**FasalAstra** is an AI-powered wand-style precision spraying device. A farmer walks through their field holding the wand, and the system:

1. **Sees** weeds in real-time using a Pi Camera OV5647 + YOLO26-nano AI model running on Raspberry Pi 4
2. **Tracks** each weed with an anti-double-trigger system to prevent redundant spraying
3. **Protects** crops by computing bounding box overlap ratios before every spray decision
4. **Calculates** the exact millisecond the weed will pass under the spray nozzle using kinematic physics
5. **Fires** a precise 50ms herbicide micro-burst — only on the weed, never on crops

### 1.3 Key Innovations

| Innovation | Mechanism | Impact |
|-----------|-----------|--------|
| **Kinematic Prediction** | Ti = D/V − 40ms (physics-based timing) | Hits moving targets with ±5mm accuracy |
| **Anti-Double-Trigger** | 2-second position lock, 30px tolerance | 5–10× reduction in herbicide waste |
| **Crop Exclusion Zone** | Abort spray if weed-crop overlap > 15% | Zero crop damage guarantee |
| **On-Device AI** | YOLO26n on RPi4 — no internet required | Works in remote fields without connectivity |
| **Homography Mapping** | Pixel Y → real-world distance via calibration table | Eliminates expensive rangefinder hardware |
| **5-Layer Safety** | Confidence → Tracked → Crop → Velocity → Range | Only fires when ALL 5 checks pass |

### 1.4 Technology Stack (v4 Final)

| Layer | Technology |
|-------|-----------|
| **AI Model** | YOLO26-nano (Ultralytics), 2.6M parameters |
| **Training** | NVIDIA RTX 3050, 200 epochs, AdamW optimizer, PyTorch + CUDA 11.8 |
| **Edge Compute** | Raspberry Pi 4 Model B (4GB RAM, Cortex-A72 @ 1.8GHz) |
| **Camera** | Pi Camera OV5647 Rev 1.3 (5MP, 54° FOV, CSI interface) |
| **IMU Sensor** | MPU6050 6-axis Accelerometer/Gyroscope via I2C |
| **Actuator** | 12V Solenoid Valve via 5V Relay Module (GPIO 17) |
| **Inference** | ONNX Runtime optimized for ARM Cortex-A72 |
| **Resolution** | 640×640 training / 640×640 inference |
| **Dataset** | 14,296 train + 1,600 val = 15,896 images, 3 classes |
| **Pipeline** | Python (core/ + rpi/ modules) |

### 2.3 Real-Time Processing Sequence

```mermaid
sequenceDiagram
    participant Camera as Pi Camera OV5647
    participant YOLO as YOLO26-nano
    participant Tracker as Weed Tracker
    participant Safety as Crop Exclusion
    participant Homography
    participant IMU as MPU6050
    participant Kinematic
    participant Solenoid as Solenoid Relay

    Camera->>YOLO: Frame 640x640 RGB
    YOLO->>YOLO: ONNX Inference (~8ms)
    YOLO-->>Tracker: Detections [boxes, conf, class]

    loop For each weed (conf > 75%)
        Tracker->>Tracker: Position match vs active weeds
        alt Already tracked (< 30px, < 2s)
            Tracker-->>Tracker: SKIP
        else New weed
            Tracker->>Safety: Check crop overlap
            alt Overlap > 15%
                Safety-->>Safety: ABORT — crop protection
            else Safe to spray
                Safety->>Homography: Centroid (cx, cy)
                Homography->>Kinematic: distance_m
                IMU->>Kinematic: velocity_m/s
                Kinematic->>Kinematic: Ti = D/V − 40ms
                alt Ti > 0
                    Kinematic->>Solenoid: Thread → delay(Ti) → HIGH 50ms
                else Ti <= 0
                    Kinematic-->>Kinematic: SKIP — weed passed
                end
            end
        end
    end
```

## 3. AI Model — YOLO26n Training & Accuracy

### 3.1 Model Specification

| Parameter | Value |
|-----------|-------|
| **Architecture** | YOLO26-nano (Ultralytics, latest generation) |
| **Parameters** | ~2.6 million (20% fewer than YOLOv8n) |
| **Input Resolution** | 320 × 320 pixels (training) / 640 × 640 (inference) |
| **Classes** | 3 — `weed` (0), `crop` (1), `soil` (2) |
| **Base Weights** | Pre-trained on COCO dataset (transfer learning) |
| **Framework** | PyTorch 2.7.1 + CUDA 11.8 |
| **Training GPU** | NVIDIA GeForce RTX 3050 Laptop (4GB VRAM) |
| **Model Size** | ~5.3 MB (.pt) → ~5 MB (.onnx) |

### 3.2 Why YOLO26n? — Model Selection Matrix

| Metric | YOLOv8n | YOLO11n | YOLO26n (Ours) |
|--------|---------|---------|----------------|
| Parameters | 3.2M | 2.6M | **2.6M** |

### 5.2 Component Specifications

#### `detector.py` — YOLO26n Inference Wrapper
- Runs YOLO26-nano inference at **640×640** resolution on RPi4
- Confidence threshold: **75%** — rejects uncertain detections
- Extracts bounding box centroids `(cx, cy)` for tracking and homography
- Returns structured dicts: `{class_id, class_name, confidence, box, centroid, inference_ms}`

#### `tracker.py` — Anti-Double-Trigger System
- **Problem:** Camera at 30 FPS detects same weed 5–10 times consecutively → wastes 5–10× herbicide
- **Solution:** Euclidean distance matching with **30-pixel tolerance** and **2-second lock duration**
- Once a weed is assigned a fire timer, all detections within 30px are ignored for 2 seconds
- Expired locks auto-cleaned each frame

#### `exclusion.py` — Crop Exclusion Zone
- Calculates what fraction of weed bounding box falls inside any crop bounding box
- Uses **overlap ratio** (not IoU) — measures "how much weed is inside crop zone"
- If overlap exceeds **15%** → spray is **aborted** to protect the crop
- Three-state return: `(is_safe, overlap_ratio, reason)`

#### `homography.py` — Pixel-to-Distance Mapping
- Camera OV5647 mounted at **45° angle** on wand, capturing at **640×640**
- Pre-calibrated lookup table with numpy linear interpolation:
- `{0→65cm, 128→50cm, 256→35cm, 384→20cm, 512→8cm, 640→0cm}`
- Eliminates need for expensive ultrasonic or laser rangefinder

#### `kinematic.py` — Time-to-Impact Calculator
- Core formula: `Ti = (D / V) − Latency` where Latency = 40ms (33ms inference + 7ms solenoid)
- Three safety checks: velocity < 0.1 m/s, distance > 0.55m, Ti ≤ 0
- Returns: `(ti_ms, is_valid, reason)`

### 5.3 Five-Layer Safety System

Every single detection passes through 5 sequential checks before the solenoid fires:

| Layer | Check | Abort If | Purpose |
|-------|-------|----------|---------|
| **1** | Confidence filter | conf < 75% | Reject uncertain/noisy detections |
| **2** | Anti-double-trigger | Same weed within 30px / 2s | Prevent redundant herbicide waste |
| **3** | Crop exclusion zone | Weed-crop overlap > 15% | Protect cash crops from damage |
| **4** | Velocity check | Speed < 0.1 m/s | Don't spray when farmer stops walking |
| **5** | Range + timing | Distance > 55cm or Ti ≤ 0 | Physical impossibility / weed already passed |

## 6. Kinematic Physics — The Core Innovation

### 6.1 The Problem

When the camera detects a weed, the weed is **ahead** of the spray nozzle. By the time the system processes the frame and the valve opens, the farmer has moved forward. If we fire immediately, the spray lands **behind** the weed — missing it entirely.

### 6.2 The Formula

```
Ti = (D / V) − Latency_total

Where:
  Ti      = Time to wait before firing (milliseconds)
  D       = Distance from weed to nozzle (meters) — from homography
  V       = Walking velocity (m/s) — from MPU6050 IMU
  Latency = 40ms (33ms inference + 7ms solenoid mechanical delay)
```

### 6.3 Worked Example

```
Scenario: Weed detected 30cm ahead, farmer walking at 1.2 m/s

Step 1: Raw arrival time
  T_raw = 0.30m / 1.2 m/s = 0.250s = 250ms

Step 2: Subtract system latency
  Ti = 250ms − 40ms = 210ms

Step 3: Action
  → Background thread waits 210ms
  → Fire solenoid HIGH for 50ms
  → Spray lands exactly when weed is under nozzle
```

### 6.4 Latency Budget

```mermaid
gantt
    title System Latency Budget (40ms total)
    dateFormat X
    axisFormat %L ms
    section Latency
    YOLO26n Inference on RPi4  : 0, 33
    Solenoid Mechanical Opening : 33, 40
```

| Latency Source | Duration | Source |
|---------------|----------|--------|
| YOLO26n inference (RPi4 ONNX) | 33ms | Measured on Cortex-A72 |
| Solenoid valve opening | 7ms | Measured on test hardware |
| **Total** | **40ms** | Subtracted from raw time |

### 6.5 Why Not Just "Spray When Detected"?

| Approach | At 1.2 m/s Walking | Spray Landing |
|----------|-------------------|---------------|
| Fire immediately | 0ms delay | **Misses by 4.8cm** (40ms × 1.2 m/s) |
| Fixed 200ms delay | Always 200ms | Only correct at ONE speed |
| **Kinematic (ours)** | **Speed-adaptive** | **Correct at any 0.1–2.0 m/s** |

### 6.6 Dynamic Velocity Scenarios

| Scenario | Distance | Velocity | Raw Time | Ti (after -40ms) | Result |
|----------|----------|----------|----------|-------------------|--------|
| Normal walking | 30cm | 1.2 m/s | 250ms | **210ms** | FIRE |
| Close weed, fast walk | 15cm | 1.2 m/s | 125ms | **85ms** | FIRE |
| Slow walking | 30cm | 0.5 m/s | 600ms | **560ms** | FIRE |
| Farmer stopped | 30cm | 0.05 m/s | — | — | **SKIP** (velocity too low) |
| Weed too far | 60cm | 1.2 m/s | — | — | **SKIP** (out of range) |
| Weed already passed | 3cm | 1.2 m/s | 25ms | -15ms | **SKIP** (Ti ≤ 0) |

## 9. Field Calibration System

### 9.1 Why Calibration Is Critical

Every physical setup is unique — camera height, angle, lens distortion all shift pixel positions. Without proper calibration, the homography table gives wrong distances, causing the solenoid to fire 5–10cm off-target. The weed survives and the entire system fails.

### 9.2 Calibration Tool (`rpi/field_calibrate.py`)

FasalAstra includes a **416-line interactive calibration tool** that:

1. Opens live camera feed on HDMI display
2. Shows horizontal reference lines every 64 pixels
3. User places ruler on ground, clicks on ruler markings in the image
4. Records `pixel_y → real_distance_cm` pairs
5. Fits a **2nd-degree polynomial** through the points
6. Generates a **ready-to-paste Python dictionary** for `core/homography.py`

### 9.3 Calibration Verification Mode

After calibration, a **verification mode** overlays predicted distances on every row of the live camera feed. The farmer can visually check if the predicted "30cm" label actually lines up with the 30cm mark on their ruler.

```mermaid
flowchart LR
    MOUNT["Mount camera<br/>on wand"] --> RULER["Place ruler<br/>under camera"]
    RULER --> CLICK["Click markings<br/>6+ points"]
    CLICK --> FIT["Polynomial fit<br/>degree 2"]
    FIT --> TABLE["Generate<br/>homography table"]
    TABLE --> VERIFY["Verification mode<br/>live check"]
    VERIFY --> PASTE["Paste into<br/>core/homography.py"]
```

### 10.1 Major Upgrades Summary

| Component | v1 (Original) | v4 (Final) | Improvement |
|-----------|--------------|------------|-------------|
| **AI Model** | YOLOv8-nano | **YOLO26-nano** | 20% fewer params, better accuracy |
| **Hardware** | ESP32-S3 (240MHz, 8MB PSRAM) | **Raspberry Pi 4** (1.8GHz, 4GB RAM) | 7.5× more compute, full Linux OS |
| **Camera** | OV2640 (320×320) | **OV5647** (640×640, 5MP, 54° FOV) | 4× resolution, better optics |
| **Inference** | TFLite INT8 (~33ms) | **ONNX Runtime** (~8ms) | 4× faster inference |
| **Dataset** | 1,557 images, 2 classes | **15,896 images, 3 classes** | **10× more data** |
| **Training** | 50 epochs | **200 epochs** | 4× more training iterations |
| **Classes** | weed, crop | **weed, crop, soil** | Background discrimination |
| **Display** | Serial monitor only | **HDMI live bounding boxes** | Real-time visual for judges |
| **Solenoid Drive** | N-Channel MOSFET (IRLZ44N) | **5V Relay Module** | Electrically isolated, safer |
| **Frame Rate** | ~20 FPS | **8–10 FPS (ONNX) / 18–22 FPS (NCNN)** | Real-time at higher resolution |

## 12. Limitations & Risks

### 12.1 Known Limitations

| Limitation | Impact | Mitigation |
|-----------|--------|------------|
| Weed mAP50 is 34.5% | High false-negative rate for weeds specifically | More weed-specific training data needed |
| No night-time operation | OV5647 has no IR capability | Add IR LED ring for future version |
| MPU6050 drift | Velocity accuracy degrades over long sessions | Periodic recalibration, Kalman filter |
| Fixed-focus camera | Depth of field limits working distance | Keep wand height at 25–40cm consistently |
| No GPS logging | Cannot map spray locations | Add GPS module for field heat-map |
| Water resistance | No enclosure design | 3D-print IP65 rated enclosure |

### 12.2 Risk Assessment

| Risk | Severity | Probability | Mitigation |
|------|----------|------------|------------|
| Crop damage from false positive | High | Low (15% exclusion zone) | 5-layer safety system |
| Solenoid stuck open | High | Very Low | Software watchdog timer (max 500ms) |
| Camera obscured by mud | Medium | Medium | Erasing augmentation trains model for partial occlusion |
| Over-spraying same weed | Medium | Very Low | Anti-double-trigger with 2s lock |
| Battery drain in field | Low | Medium | Low-power ONNX inference on ARM |
