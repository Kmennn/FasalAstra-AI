## 1. Project Overview

### 1.1 Problem Statement

Indian farmers lose **₹50,000–₹1,00,000 per acre annually** due to weed infestation. Current solutions — manual labor or blanket herbicide spraying — are either labor-intensive or environmentally harmful. Blanket spraying wastes 70-80% of herbicide on bare soil and damages crops through chemical drift.

### 1.2 Proposed Solution

**FasalAstra** is an AI-powered wand-style device that a farmer walks through their field with. It:

1. **Sees** weeds in real-time using a camera + YOLOv8-nano AI model
2. **Calculates** the exact moment the weed will pass under the spray nozzle using physics
3. **Fires** a precise 50ms herbicide burst — only on the weed, never on crops

### 1.3 Key Innovations

| Innovation | What It Does | Why It Matters |
|-----------|-------------|----------------|
| **Kinematic Prediction** | Calculates spray timing using `Ti = D/V − 40ms` | Hits moving targets with ±5mm precision |
| **Anti-Double-Trigger** | Locks weed positions for 2 seconds | 5-10× reduction in herbicide waste |
| **Crop Exclusion Zone** | Aborts spray if weed overlaps crop by >15% | Prevents crop damage |
| **On-Device AI** | Runs entirely on ESP32-S3, no internet needed | Works in remote fields without connectivity |
| **Homography Mapping** | Converts camera pixels to real-world distance | No expensive rangefinder needed |

### 1.4 Technology Stack

| Layer | Technology |
|-------|-----------|
| **AI Model** | YOLOv8-nano (Ultralytics), PyTorch 2.7.1+cu118 |
| **Training** | NVIDIA RTX 3050, 50 epochs, AdamW optimizer |
| **Edge Deployment** | TFLite INT8 on ESP32-S3 (240MHz, 8MB PSRAM) |
| **Sensors** | OV2640 Camera (320×320), MPU6050 IMU (6-axis) |
| **Actuator** | 12V Solenoid Valve via N-Channel MOSFET |
| **Pipeline** | Python (PC simulation) + C++ Arduino (embedded) |

### 3.8 INT8 Quantization for Edge Deployment

| Model Format | Size | Accuracy (est.) | ESP32-S3 Inference |
|-------------|------|-----------------|-------------------|
| PyTorch FP32 (.pt) | 6.2 MB | 85.7% mAP50 | ❌ Cannot run |
| TFLite FP16 | ~3.1 MB | ~85.0% mAP50 | ⚠️ ~60ms (slow) |
| **TFLite INT8** | **~1.5 MB** | **~82-83% mAP50** | ✅ **~33ms (target)** |

### 4.2 Component Specifications

#### `detector.py` — YOLO Inference Wrapper
- Runs YOLOv8-nano inference at 320×320 resolution
- Filters detections below 75% confidence
- Extracts bounding box centroids `(cx, cy)` for tracking and homography
- Returns structured detection dicts with class, confidence, box, centroid

#### `tracker.py` — Anti-Double-Trigger System
- **Problem solved:** Camera at 30 FPS detects the same weed 5-10 times consecutively → would waste 5-10× herbicide
- **Solution:** Position-based weed ID assignment with 2-second lock and 30-pixel tolerance
- Once a weed is assigned a timer, all future detections within 30px are ignored for 2 seconds

#### `exclusion.py` — Crop Exclusion Zone
- Calculates what fraction of a weed's bounding box falls inside any crop bounding box
- If overlap exceeds 15% → **spray is aborted** to protect the crop
- Uses overlap ratio (not IoU) because we care about "how much weed is inside crop zone"

#### `homography.py` — Pixel-to-Distance Mapping
- Camera mounted at 45° on the wand creates a known geometric relationship
- Pre-calibrated lookup table: pixel Y-coordinate → real-world distance in cm
- 5-point table with numpy linear interpolation: `{0→50cm, 80→40cm, 160→30cm, 240→15cm, 320→0cm}`
- Eliminates need for expensive ultrasonic or laser rangefinder

#### `kinematic.py` — Time-to-Impact Calculator
- Implements the core physics formula: `Ti = (D / V) − Latency`
- Three safety checks: velocity too low, distance out of range, Ti ≤ 0 (weed already passed)
- Returns firing time in milliseconds + validity flag + reason

### 4.3 Five-Layer Safety System

Every detection passes through 5 checks before the solenoid fires:

| Layer | Check | Abort If | Purpose |
|-------|-------|----------|---------|
| 1 | Confidence filter | conf < 75% | Reject uncertain detections |
| 2 | Anti-double-trigger | Same weed seen within 30px / 2s | Prevent herbicide waste |
| 3 | Crop exclusion | Weed-crop overlap > 15% | Protect cash crops |
| 4 | Velocity check | Speed < 0.1 m/s | Don't spray when farmer stops |
| 5 | Range + timing | Distance > 55cm or Ti ≤ 0 | Physical impossibility checks |

## 5. Kinematic Physics — The Core Innovation

### 5.1 The Problem

When the camera detects a weed, the weed is **ahead** of the spray nozzle. By the time the system processes and the valve opens, the farmer has moved forward. If we fire immediately, the spray lands **behind** the weed.

### 5.2 The Formula

```
Ti = (D / V) − Latency_total

Where:
  Ti      = Time to wait before firing (milliseconds)
  D       = Distance from weed to nozzle (meters) — from homography
  V       = Walking velocity (m/s) — from MPU6050 IMU
  Latency = 40ms (33ms inference + 7ms solenoid mechanical delay)
```

### 5.3 Worked Example

```
Scenario: Weed detected 30cm ahead, farmer walking at 1.2 m/s

Step 1: Raw arrival time
  T_raw = 0.30m / 1.2 m/s = 0.250s = 250ms

Step 2: Subtract system latency
  Ti = 250ms − 40ms = 210ms

Step 3: Action
  → Wait 210ms
  → Fire solenoid HIGH for 50ms
  → Spray lands exactly when weed is under nozzle ✅
```

### 5.4 Latency Breakdown

```mermaid
gantt
    title System Latency Budget (40ms total)
    dateFormat X
    axisFormat %L ms
    section Latency
    YOLO Inference (ESP32-S3)  : 0, 33

| Latency Source | Duration | Source |

| Solenoid valve opening | 7ms | Measured on test hardware |
| **Total** | **40ms** | Subtracted from raw time |

### 5.5 Why Not Just "Spray When Detected"?

| Approach | At 1.2 m/s | Spray Landing |
|----------|-----------|---------------|
| Fire immediately | 0ms delay | Misses by 4.8cm (40ms × 1.2 m/s) |
| Fixed 200ms delay | Always 200ms | Only correct at one speed |
| **Kinematic (ours)** | **Speed-adaptive** | **Correct at any 0.1-2.0 m/s** ✅ |

| Solenoid Burst | 50ms | Blocking during spray |

### Phase 5: Calibration (~1-2 hours)

#### IMU Calibration
1. Load MPU6050 calibration sketch from library examples
2. Place device on flat, level surface
3. Run calibration → record offset values
4. Update offsets in firmware: `mpu.setXAccelOffset()`, etc.

#### Homography Calibration
1. Mount camera at 45° angle on wand
2. Place ruler in camera's field of view
3. Measure actual distance (in cm) at 5 pixel Y positions
4. Update `HOMOGRAPHY_TABLE` in firmware with your measurements

#### Solenoid Test
```cpp
// In setup(), temporarily add:
digitalWrite(SOLENOID_PIN, HIGH);
delay(50);
digitalWrite(SOLENOID_PIN, LOW);
// Listen for a single "click" — confirms circuit works
```

### Phase 6: Field Testing

```
Pre-Field Checklist:
□ Camera focused at ~30cm working distance
□ IMU Z-axis aligned with direction of travel
□ Solenoid tested for 10ms–500ms burst range
□ Homography table verified with ruler test
□ Battery at full charge (12V for solenoid)
□ Serial monitor shows stable ~20 FPS

In-Field Protocol:
1. Start slow — walk at 0.5 m/s
2. Point at known weed patches
3. Monitor Serial telemetry (detection, Ti, FIRE events)
4. Gradually increase to 1.2 m/s normal walking speed
5. Check for false positives (crops sprayed) — should be 0
6. Check for false negatives (weeds missed)
7. Record telemetry log for post-analysis
```

## 10. Limitations & Risks

### 10.1 Identified Limitations

| # | Limitation | Severity | Detail |
|---|-----------|----------|--------|
| 1 | ESP32 camera/inference integration pending | 🔴 Critical | Camera and TFLite code needs implementation |
| 2 | No field testing performed | 🔴 Critical | All metrics are PC-simulation only |
| 3 | IMU uses simple Euler integration | 🟠 High | Velocity drift over time without Kalman filter |
| 4 | Homography is 1D (Y-axis only) | 🟠 High | Distance accuracy decreases at frame edges |
| 5 | Solenoid delay blocks frame processing | 🟠 High | Misses other weeds during spray burst |
| 6 | Only 2 of 4 planned datasets used | 🟡 Medium | Reduced exposure to dense canopy weeds |
| 7 | 22% weeds missed (78% recall) | 🟡 Medium | ~1 in 5 weeds goes unsprayed |
| 8 | Small validation set (148 images) | 🟡 Medium | Reported accuracy may be optimistic |
| 9 | No wind compensation | 🟡 Medium | Outdoor spray drift not accounted for |
| 10 | Fixed 40ms latency assumption | 🟡 Medium | Actual latency varies with conditions |
| 11 | No night-time / low-light handling | 🟡 Medium | RGB camera only, no IR |
| 12 | INT8 quantization accuracy drop (~2-3%) | 🟡 Medium | Theoretical; not yet measured |
| 13 | No multi-nozzle support | 🟢 Low | Single spray point limits coverage width |
| 14 | No weed species identification | 🟢 Low | All weed types treated with same action |
